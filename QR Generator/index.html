<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="symbol.jpg" type="image/x-icon">
</head>
<body>
    <div class="QR-Container">
    <div class="Symbol">
        <img src="symbol.jpg" width="30px" height="30px" alt="">
    </div>
    <div class="Container-1">
        <h2 class="title">QR Code Generator</h2>
        <h6 style="color: grey;">Fast, simple, and instant</h6>
    </div>

    <div class="Container-2">
        <h6 style="color: grey;">Enter text or URL</h6>
        <input type="text" id="input-box" maxlength="200" class="input-container">
        <div class="generate">
            <button type="button" id="generate-button" style="width: 40%;" onclick="qrgeneration()">Generate QR Code</button> 
            <button type="button" id="clear" onclick="ClearEverything()">Clear</button>
        </div>
        
    </div>

    <div class="successdisplay">
      <p></p>
    </div>

    <div class="errordisplay">
      <p></p>
    </div>

    <div class="Container-3-value" id="image-container">
        <img class="QR-code" id="qr-image" height="250px" width="250px">
        <div class="buttons">
        <button id="Download-button" style="background-color:rgb(31, 228, 34); color: white;"><span style="color: white;"> ↓ </span>Download </button> 
        <button id="Copy-button" style="background-color: rgb(255, 255, 227);"><span>⿻ </span>Copy URL</button>
        </div>
    </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
