<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Faustina:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <h1>To-Do List</h1>


    <section>
    <div class="input-container">
    <input type="text" id="task-input" placeholder="          Enter the task">
    <button onclick="addTask()" id="add-button">Add task</button>
    <button id="resetbutton">Reset</button>
    <span id="errormsg"></span>
    <span id="successmsg"></span>
    <h4>Task List</h4>
    <section id="task-container">
        
    </section>
    <section class="task-completion">
        <span id="complete">Completed</span> <span id="notcompleted">UnCompleted</span>
    </section>
    
    </div>
    </section>

    <div>

    </div>
    <script src="script.js"></script>
</body>
</html>
